services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: anp
      POSTGRES_PASSWORD: anp
      POSTGRES_DB: anp
    ports:
      - "5433:5432"
    volumes:
      - anp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anp -d anp"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  anp_pgdata:
